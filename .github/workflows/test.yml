name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests
        shell: pwsh
        run: |
          $result = Invoke-Pester './Clean-NuGetPackages.Tests.ps1' -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
